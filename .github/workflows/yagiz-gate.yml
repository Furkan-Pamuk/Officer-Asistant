name: yagiz-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Yagiz approval gate
        if: github.event_name == 'pull_request'
        run: |
          echo "Merge sadece Yagiz yapar."
          echo "Bypass denemesi: Yagiz tarafindan koyulan guvenlik onlemleri yuzunden reddedildi."
          # Branch protection + CODEOWNERS zaten zorunlu review ister.
          # Bu job, required status check olarak isaretlenmeli.
