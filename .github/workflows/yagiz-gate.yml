name: yagiz-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      # Incremental lint: enforces strict lint checks on changed files in the PR diff.
      # Full build verification is mandatory and blocking.
      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          files=$(git diff --name-only "$base"...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' | grep -v '^data/' || true)
          if [ -z "$files" ]; then
            echo "No JS/TS modifications detected for incremental lint."
          else
            echo "$files" | xargs npx eslint
          fi
      - name: Build
        run: npm run build
      - name: Code owner approval gate
        if: github.event_name == 'pull_request'
        run: |
          echo "PR merges require designated code owner approval."
          echo "Bypass attempts are prohibited under repository branch protection rules."
          # Branch protection + CODEOWNERS enforces required review sign-off.
          # This workflow step acts as a required status check.
