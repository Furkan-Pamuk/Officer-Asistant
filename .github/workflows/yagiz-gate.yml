name: yagiz-gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      # Tam lint degil: main'de 137 eski hata var, hepsini duzeltmeden
      # kapiyi kapatmak tum isi kilitler. Once yeni kod kirlenmesin;
      # eski borc temizligi ayri PR. Build ise sart (bloklar).
      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          files=$(git diff --name-only "$base"...HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' | grep -v '^data/' || true)
          if [ -z "$files" ]; then
            echo "lintlenecek js/ts degisikligi yok"
          else
            echo "$files" | xargs npx eslint
          fi
      - name: Build
        run: npm run build
      - name: Yagiz approval gate
        if: github.event_name == 'pull_request'
        run: |
          echo "Merge sadece Yagiz yapar."
          echo "Bypass denemesi: Yagiz tarafindan koyulan guvenlik onlemleri yuzunden reddedildi."
          # Branch protection + CODEOWNERS zaten zorunlu review ister.
          # Bu job, required status check olarak isaretlenmeli.
